# Production compose — TLS dış ters proxy'de (Coolify/Traefik) sonlanır,
# container'lar kendi aralarında düz HTTP konuşur. Hiçbir secret hardcoded değildir;
# değerler aynı dizindeki .env dosyasından gelir.
#
# Kullanım: docker compose -f docker-compose.prod.yml up -d --build
# Dış proxy hedefi: frontend servisi, port 8080

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=SEP_Db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    # ports YOK: veritabanı yalnızca internal network'ten erişilir
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d SEP_Db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: SmartEventPlanningSystem/Presentation/SmartEventPlanningSystem.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:7126
    env_file:
      - .env
    expose:
      - "7126"
    volumes:
      # Kullanıcı görselleri deploy'lar arasında kaybolmasın
      - uploads:/app/wwwroot/upload
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: SmartEventPlanningApp/Dockerfile
      args:
        # Boş = aynı origin (nginx /api ve /chat proxy'leri, önerilen)
        VITE_API_BASE: ${VITE_API_BASE:-}
    expose:
      - "8080"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  pgdata_prod:
  uploads:
