# SADECE lokal test override'ı: dış ters proxy'nin (Coolify/Traefik) yerine
# frontend'i host'a açar. Prod'da KULLANMAYIN — prod'da dış proxy frontend:8080'e
# container network'ü üzerinden bağlanır.
#
# Kullanım: docker compose -f docker-compose.prod.yml -f docker-compose.local.yml up -d
services:
  frontend:
    ports:
      - "8080:8080"
